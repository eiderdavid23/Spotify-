<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Música</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#121212"><link rel="icon" href="icon.svg"></head>
<body>
<header><h1>🎵 Mi Música</h1>
<label class="btn">+ Agregar<input id="files" type="file" accept="audio/*" multiple hidden></label></header>
<div id="opts"><button id="sur" class="btn">✨ Sorpréndeme</button>
<select id="type"><option value="musica">Tipo: Música</option><option value="podcast">Tipo: Podcast</option></select>
<label><input type="checkbox" id="only"> Solo música</label>
</div>
<main>
<h2>📌 Fijados</h2><ul id="pins"></ul>
<h2>🕘 Recientes</h2><ul id="rec"></ul>
<h2>Biblioteca</h2><ul id="list"></ul>
</main>
<footer id="player">
<b id="title">Nada sonando</b>
<input id="seek" type="range" min="0" max="100" value="0">
<div id="ctrl"><button id="shuf">🔀</button><button id="prev">⏮</button><button id="play">▶</button><button id="next">⏭</button></div>
</footer>
<audio id="a"></audio><script src="app.js"></script></body></html>
